# Runs the suite with EVERY suggested reference package installed, and fails if
# any test reports as skipped.
#
# The reference-comparison tests are guarded with skip_if_not_installed(), which
# makes them silently vanish in an environment lacking those packages. That is
# the right behaviour for a user's machine and the wrong behaviour for CI: a
# guard that always skips proves nothing. This job is what turns those tests
# into evidence.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check-full

permissions: read-all

jobs:
  full-dependencies:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, all suggests)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # every optional backend and reference implementation, so nothing skips
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::randomForestSRC
            any::cmprsk
            any::pec
            any::SurvMetrics
            any::timeROC
            any::survC1
          needs: check

      - name: Run the test suite and fail on any skip
        run: |
          res <- testthat::test_local(reporter = "summary", stop_on_failure = TRUE)
          df <- as.data.frame(res)
          skipped <- df[df$skipped, c("file", "test")]
          if (nrow(skipped) > 0) {
            cat("Tests skipped in the full-dependency job:\n")
            print(skipped)
            stop("Every test must run when all suggested packages are installed.")
          }
          cat("No tests skipped.\n")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
